<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern Retrieval: Guess the Glyph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <div class="brand">
          <div class="brand__title">PATTERN RETRIEVAL</div>
          <div class="brand__subtitle">GUESS THE GLYPH · STATUS: ONLINE</div>
        </div>
        <div class="hud">
          <div class="hud__user" id="hudUser" aria-hidden="true">
            <canvas id="hudAvatar" width="32" height="32"></canvas>
            <div class="hud__name" id="hudName">--</div>
          </div>
          <div class="hud__item">
            <div class="hud__label">ROUND</div>
            <div class="hud__value" id="roundText">-- / --</div>
          </div>
          <div class="hud__item">
            <div class="hud__label">SCORE</div>
            <div class="hud__value" id="scoreText">0</div>
          </div>
        </div>
      </header>

      <section class="screen screen--title" id="screenTitle">
        <div class="panel">
          <div class="panel__headline">PATTERN RETRIEVAL</div>
          <div class="panel__sub">the network has stored a memory. recall it.</div>
          <div class="reg" id="regBlock">
            <div class="reg__row">
              <div class="reg__label">REGISTRATION</div>
              <input
                class="reg__input"
                id="nameInput"
                type="text"
                inputmode="text"
                autocomplete="nickname"
                maxlength="18"
                placeholder="enter name"
                aria-label="registration name"
              />
              <div class="reg__label reg__label--sub">AVATAR</div>
              <input class="reg__file" id="avatarUpload" type="file" accept="image/*" aria-label="upload avatar" />
              <button class="btn btn--ghost reg__random" id="avatarRandomBtn" type="button">USE RANDOM</button>
              <button class="btn reg__register" id="registerBtn" type="button">REGISTER</button>
            </div>
            <div class="reg__avatar">
              <canvas id="avatarCanvas" width="96" height="96" aria-label="pixel face"></canvas>
            </div>
          </div>
          <div class="panel__row hidden" id="difficultyRow">
            <button class="btn" data-difficulty="easy">EASY</button>
            <button class="btn" data-difficulty="medium">MEDIUM</button>
            <button class="btn" data-difficulty="hard">HARD</button>
          </div>
          <div class="panel__hint" id="registerHint">enter a name. register to proceed.</div>
          <div class="panel__hint hidden" id="difficultyHint">select a mode. watch the scatter converge. choose the label.</div>
        </div>
      </section>

      <section class="screen screen--game hidden" id="screenGame">
        <div class="stage">
          <div class="crt">
            <div class="crt__glass">
              <canvas id="gridCanvas" width="480" height="480" aria-label="Pixel recall display"></canvas>
            </div>
          </div>
          <div class="statusline" id="statusText">RECALLING...</div>
        </div>

        <div class="choices hidden" id="choices">
          <button class="choice" data-choice="0"></button>
          <button class="choice" data-choice="1"></button>
          <button class="choice" data-choice="2"></button>
          <button class="choice" data-choice="3"></button>
        </div>
      </section>

      <section class="screen screen--end hidden" id="screenEnd">
        <div class="panel">
          <div class="panel__headline">RETRIEVAL COMPLETE</div>
          <div class="panel__sub" id="finalText">--</div>
          <div class="sharecard">
            <canvas id="shareCanvas" width="1080" height="1080" aria-label="Shareable result card"></canvas>
          </div>
          <pre class="sharebox" id="shareText"></pre>
          <div class="panel__row">
            <button class="btn" id="copyBtn">COPY RESULT</button>
            <button class="btn" id="tweetBtn">POST TO X</button>
            <button class="btn" id="copyImageBtn">COPY IMAGE</button>
            <button class="btn" id="downloadBtn">DOWNLOAD IMAGE</button>
            <button class="btn btn--ghost" id="againBtn">RESTART</button>
          </div>
          <div class="panel__hint" id="copyHint"></div>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
